# Local run: docker compose up --build  ->  http://localhost:3000
services:
  backend:
    build: ./backend
    environment:
      ACS_EMAIL_CONNECTION_STRING: ${ACS_EMAIL_CONNECTION_STRING:-}
      ACS_EMAIL_SENDER_ADDRESS: ${ACS_EMAIL_SENDER_ADDRESS:-}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
